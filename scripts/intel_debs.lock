# official GitHub release pages (oneapi-src/level-zero, intel/compute-runtime,
# intel/intel-graphics-compiler). Driver+IGC are version-coupled:
# libze-intel-gpu1 26.35 hard-depends intel-igc-core-2 == 2.41.5;
# intel-opencl-icd hard-depends intel-igc-opencl-2 == 2.41.5.
# The NEO OpenCL runtime (intel-opencl-icd + igc-opencl) is required even
# though torch runs on Level Zero: oneDNN's GPU kernel compiler errors
# "OpenCL device not found" -> "could not create a primitive" without it
# (live on A770, 2026-10-25).
# opencl-icd hash matches Intel's ww35.sum; igc-opencl matches the digest
# published in the IGC v2.41.5 release notes. Bump all together from one
# compute-runtime release set, then re-hash.
