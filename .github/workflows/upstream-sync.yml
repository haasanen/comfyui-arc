name: Upstream sync (ComfyUI release -> bump, tag, build, smoke)

# Daily: if upstream Comfy-Org/ComfyUI has a newer release than the pin in
# the Dockerfile, bump ref+sha256, commit, tag v<version>, build, push image
# <version>/main, smoke-test, then AUTO-PROMOTE <version>-h1 (deploy artifact,
# same digest, git tag v<version>-h1). A GITHUB_TOKEN push does not re-trigger
# workflows, so this workflow does the whole chain in one run. Deploys remain
# owner-gated: NAS compose pins the -h<N> tag; owner flips the pin.
# Known limit: the torch/torchvision XPU wheel pins stay manual; if a new
# ComfyUI breaks them, the smoke test fails and this run goes red (no
# half-released image).

on:
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Check upstream release
        id: check
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          cur=$(grep -oP 'ARG COMFY_REF=\K\S+' Dockerfile)
          latest=$(curl -fsSL -H "authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/comfy-org/ComfyUI/releases/latest \
            | jq -r .tag_name)
          echo "pinned=$cur latest=$latest"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "no upstream release found" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ver=${latest#v}
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$cur" ]; then
            echo "up to date (${latest}) — building anyway" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sha=$(curl -fsSL "https://github.com/Comfy-Org/ComfyUI/archive/refs/tags/${latest}.tar.gz" \
            | sha256sum | cut -d' ' -f1)
          oldsha=$(grep -oP 'echo "\K[0-9a-f]{64}(?=  /tmp/comfy\.tar\.gz)' Dockerfile)
          sed -i "s|ARG COMFY_REF=.*|ARG COMFY_REF=${latest}|" Dockerfile
          sed -i "s|${oldsha}|${sha}|" Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -aqm "upstream-sync: ComfyUI ${latest}"
          git push
          git tag "${latest}"
          git push origin "${latest}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "bumped ${cur} -> ${latest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        if: steps.check.outputs.version != ''
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: steps.check.outputs.version != ''
        run: |
          set -euo pipefail
          IMG=ghcr.io/${{ github.repository }}
          VER=${{ steps.check.outputs.version }}
          docker build -t "$IMG:$VER" -t "$IMG:main" \
            --build-arg COMFY_REF="v$VER" .

      - name: Smoke test (XPU wheels importable)
        if: steps.check.outputs.version != ''
        run: |
          set -euo pipefail
          IMG=ghcr.io/${{ github.repository }}
          VER=${{ steps.check.outputs.version }}
          docker run --rm "$IMG:$VER" \
            python -c "import torch; assert torch.__version__.endswith('+xpu'); print('xpu ok', torch.__version__)"

      - name: Push (only after smoke passes)
        if: steps.check.outputs.version != ''
        run: |
          set -euo pipefail
          IMG=ghcr.io/${{ github.repository }}
          VER=${{ steps.check.outputs.version }}
          docker push "$IMG:$VER"
          docker push "$IMG:main"

      - name: Auto-promote h1 deploy artifact
        if: steps.check.outputs.version != ''
        run: |
          set -euo pipefail
          IMG=ghcr.io/${{ github.repository }}
          VER=${{ steps.check.outputs.version }}
          # Guard against the REMOTE: actions/checkout does not fetch tags
          # (fetch-tags defaults to false), so a local rev-parse never sees an
          # already-published v<ver>-h1 and the tag push dies "already exists"
          # on every later "build anyway" run. If the git tag exists, this
          # version's deploy artifact is published: skip re-tagging entirely
          # (a rebuilt tree could otherwise move the live -h1 ghcr digest).
          if git ls-remote --exit-code --tags origin "refs/tags/v${VER}-h1" >/dev/null 2>&1; then
            echo "v${VER}-h1 already published — deploy artifact intact, skipping promotion" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker tag "$IMG:$VER" "$IMG:${VER}-h1"
          docker push "$IMG:${VER}-h1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -m "auto-promote ${VER} -> deploy artifact ${VER}-h1" "v${VER}-h1"
          git push origin "v${VER}-h1"
