name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (XPU wheels importable)
        run: |
          docker run --rm "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" \
            python -c "import torch; assert torch.__version__.endswith('+xpu'); print('xpu ok', torch.__version__)"
      - name: Smoke test (Level Zero GPU driver + baked scripts present)
        run: |
          # Regression pin for the 2026-10-25 crash-loop: the wheels ship the
          # Level Zero LOADER only; the image must also carry the Intel GPU
          # driver (libze_intel_gpu) or device enumeration is 0 on a real card.
          docker run --rm "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" \
            sh -c 'ldconfig -p | grep -q libze_intel_gpu && echo "L0 gpu driver ok" && test -f /app/scripts/fetch_models.sh && echo "scripts ok"'
